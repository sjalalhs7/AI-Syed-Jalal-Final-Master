services:
  - type: web
    name: ai-syed-jalal-api
    runtime: docker
    plan: free
    region: singapore
    branch: recovery/data-upgrade-2026-10-22
    dockerContext: ./source/AI-Syed-Jalal-FINAL-RECOVERED
    dockerfilePath: ./source/AI-Syed-Jalal-FINAL-RECOVERED/backend/Dockerfile
    dockerCommand: sh -c "node scripts/migrate.mjs && node server.mjs"
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    initialDeployHook: node scripts/seed.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: PGSSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: CORS_ORIGIN
        value: https://ai-syed-jalal-live.pages.dev
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: aj_session
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: TRUST_PROXY
        value: "true"
      - key: CSRF_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-pro
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OMNIROUTE_KEY
        value: ""
      - key: OMNIROUTE_URL
        value: ""
      - key: PUBLIC_CHAT_ENABLED
        value: "false"
      - key: PUBLIC_CHAT_DAILY_MAX
        value: "300"
      - key: PUBLIC_CHAT_PROVIDER
        value: deepseek
