name: Assemble Android signing inputs

# One-time transfer of non-secret build outputs. The signing key never goes to
# GitHub Actions. Unreferenced Git blobs are used because this workspace cannot
# reach the artifact storage host; no binary is added to a branch or release.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-export-sign-inputs.yml']

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Inspect the API 26 emulator setup failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/131313477558/logs" > "$RUNNER_TEMP/previous-job.log"
          python3 - "$RUNNER_TEMP/previous-job.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf8', errors='replace').splitlines()
          # Only emit the final setup/error lines from the synthetic emulator job.
          text = '\n'.join(lines[-55:])[-12000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice file=android/README.md,line=1,title=API 26 emulator setup::' + text)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build an unsigned, zip-aligned APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and export public build inputs as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          AAPT="$TOOLS/aapt"
          APKSIGNER="$TOOLS/lib/apksigner.jar"
          test -s "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -F "package: name='dev.pages.ai_syed_jalal_live.mobile'"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          export_blob() {
            local name="$1" path="$2" sha checksum
            python3 - "$path" "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}))
          PY
            sha=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
            checksum=$(sha256sum "$path" | cut -d' ' -f1)
            test "${#sha}" = 40
            echo "::notice file=android/README.md,line=1,title=${name}::git_blob_sha=${sha} sha256=${checksum}"
          }
          export_blob 'Unsigned APK transfer' "$APK"
          export_blob 'Official Android apksigner transfer' "$APKSIGNER"
          rm -f "$RUNNER_TEMP/blob.json"
