name: Assemble updated Android signing input

# Public unsigned build only. The private signing key stays outside GitHub.
# This build includes the intended-origin-only Android launch fix and imports.
# A transient, unreferenced Git blob bridges this workspace's artifact-storage
# network restriction; the APK is not committed to the branch.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-export-sign-inputs.yml']

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build unsigned release APK
        working-directory: android
        run: |
          set -euo pipefail
          # The public Maven Central service occasionally responds with 429 on
          # shared runners. Retry a transient failure rather than masking it.
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon :app:assembleRelease; then exit 0; fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep 45
          done
      - name: Verify and export the unsigned APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$TOOLS/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='dev.pages.ai_syed_jalal_live.mobile' versionCode='3'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='1.0.2'" "$RUNNER_TEMP/badging.txt"
          "$TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -F 'dev.pages.ai_syed_jalal_live.twa.SafeLauncherActivity'
          "$TOOLS/zipalign" -c -p 4 "$APK"
          python3 - "$APK" "$RUNNER_TEMP/blob.json" <<'PY'
          import base64, json, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          pathlib.Path(sys.argv[2]).write_text(json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}))
          PY
          sha=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$RUNNER_TEMP/blob.json" --jq .sha)
          checksum=$(sha256sum "$APK" | cut -d' ' -f1)
          test "${#sha}" = 40
          echo "::notice file=android/README.md,line=1,title=Updated unsigned APK transfer::git_blob_sha=${sha} sha256=${checksum}"
          rm -f "$RUNNER_TEMP/blob.json"
