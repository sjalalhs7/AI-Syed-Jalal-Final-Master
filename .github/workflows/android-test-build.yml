name: Android test build

on:
  push:
    branches: [main, 'arena/**']
    paths: ['android/**', '.github/workflows/android-test-build.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-test-build.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK and unsigned bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build Android test artifacts
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify outputs, target SDK and permissions
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          test -s app/build/outputs/bundle/release/app-release.aab
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/android-badging.txt
          grep -F "targetSdkVersion:'36'" /tmp/android-badging.txt
          grep -F "package: name='dev.pages.ai_syed_jalal_live.twa'" /tmp/android-badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/android-permissions.txt
          if grep -E 'android.permission\.(POST_NOTIFICATIONS|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_[A-Z_]+|ACCESS_MEDIA_LOCATION|MANAGE_MEDIA|RECORD_AUDIO|WAKE_LOCK|RECEIVE_BOOT_COMPLETED|FOREGROUND_SERVICE[A-Z_]*)' /tmp/android-permissions.txt; then
            echo 'Unexpected notification, filesystem, background-work or native microphone permission' >&2; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-artifacts-not-for-play
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
