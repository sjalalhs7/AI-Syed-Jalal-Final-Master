name: Inspect Android build failure

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-build-inspect.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize the completed debug build failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 43280409452 -R "$GITHUB_REPOSITORY" --job 131399889523 --log > "$RUNNER_TEMP/build.log"
          python3 - "$RUNNER_TEMP/build.log" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf8',errors='replace').splitlines()
          hits=[i for i,s in enumerate(lines) if any(x in s.lower() for x in ('error:', 'what went wrong', 'could not', 'http 429', 'compilation failed'))]
          indices=set(j for i in hits[-8:] for j in range(max(0,i-2),min(len(lines),i+4)))
          text=('\n'.join(lines[i] for i in sorted(indices)) or '\n'.join(lines[-30:]))[-10000:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=android/README.md,line=1,title=Android debug build failure::'+text)
          PY
