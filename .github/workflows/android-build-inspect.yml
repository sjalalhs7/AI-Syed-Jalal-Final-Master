name: Inspect Android launch failure

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-build-inspect.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the synthetic Android 11 launch failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 43281114162 -R "$GITHUB_REPOSITORY" --job 131403114879 --log > "$RUNNER_TEMP/job.log"
          gh run download 43281114162 -R "$GITHUB_REPOSITORY" -n android-launch-evidence-api-30 -D "$RUNNER_TEMP/evidence"
          python3 - "$RUNNER_TEMP/job.log" "$RUNNER_TEMP/evidence" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf8',errors='replace').splitlines()
          hits=[i for i,s in enumerate(lines) if any(x in s.lower() for x in ('error', 'failed', 'exception', 'fatal'))]
          indices=set(j for i in hits[-6:] for j in range(max(0,i-3),min(len(lines),i+4)))
          text=('\n'.join(lines[i] for i in sorted(indices)) or '\n'.join(lines[-25:]))[-9000:]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=android/README.md,line=1,title=Android 11 failure details::'+text)
          root=Path(sys.argv[2])
          for p in sorted(root.iterdir()):
              if p.name not in ('external-intent-start.txt','external-intent-filter.txt','relaunch-logcat.txt'): continue
              text=p.read_text(encoding='utf8',errors='replace')[-5000:]
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice file=android/README.md,line=1,title=Android 11 {p.name}::{text}')
          print('::notice file=android/README.md,line=1,title=Android 11 evidence files::'+', '.join(p.name for p in root.iterdir()))
          PY
