name: Inspect website test failure

# One-off inspection of synthetic CI output, with no production data.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/website-inspect-ci.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize the failing Playwright test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 43258286896 -R "$GITHUB_REPOSITORY" --job 131322357436 --log > "$RUNNER_TEMP/job.log"
          python3 - "$RUNNER_TEMP/job.log" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf8',errors='replace').splitlines()
          hits=[i for i,line in enumerate(lines) if '1) tests/browser/data-transfer-race.spec.mjs:' in line]
          excerpts=lines[hits[-1]:hits[-1]+30] if hits else []
          text='\n'.join(excerpts)[:12000] or 'No detailed error located in the job log.'
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=source/AI-Syed-Jalal-FINAL-RECOVERED/tests/browser/data-transfer-race.spec.mjs,line=1,title=Playwright failure details::'+text)
          PY
      - name: Inspect the last synthetic browser actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43258286896 -R "$GITHUB_REPOSITORY" -n browser-test-evidence -D "$RUNNER_TEMP/evidence"
          python3 - "$RUNNER_TEMP/evidence" <<'PY'
          from pathlib import Path
          import json, sys, zipfile
          root=Path(sys.argv[1])
          traces=list(root.rglob('trace.zip'))
          out=[]
          for path in traces:
              if 'data-transfer-race-a-slow' not in str(path): continue
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      if not name.endswith('.trace'): continue
                      events=[]
                      for line in z.read(name).splitlines():
                          try: e=json.loads(line)
                          except Exception: continue
                          if e.get('type')=='before' and e.get('apiName'):
                              p=e.get('params',{})
                              events.append(f"{e.get('apiName')}: {str(p.get('selector',''))[:180]}")
                      out+=events[-25:]
          text=('\n'.join(out) or 'No browser action trace found.')[:9000]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=source/AI-Syed-Jalal-FINAL-RECOVERED/tests/browser/data-transfer-race.spec.mjs,line=1,title=Last synthetic browser actions::'+text)
          PY
      - name: Inspect the Android release-retention failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 43277531971 -R "$GITHUB_REPOSITORY" --job 131389826650 --log > "$RUNNER_TEMP/release.log"
          python3 - "$RUNNER_TEMP/release.log" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf8',errors='replace').splitlines()
          hits=[i for i,line in enumerate(lines) if any(term in line.lower() for term in ('http ', 'error', 'failed', 'denied', 'not found'))]
          excerpts=[]
          for i in hits[-5:]: excerpts+=lines[max(0,i-2):min(len(lines),i+3)]
          text=('\n'.join(excerpts) or '\n'.join(lines[-15:]))[:10000]
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=android/README.md,line=1,title=Android retention failure::'+text)
          PY
