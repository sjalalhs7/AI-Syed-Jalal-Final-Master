name: Inspect website test failure

# One-off inspection of synthetic CI output, with no production data.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/website-inspect-ci.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize the failing Playwright test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 43258286896 -R "$GITHUB_REPOSITORY" --job 131322357436 --log > "$RUNNER_TEMP/job.log"
          python3 - "$RUNNER_TEMP/job.log" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf8',errors='replace').splitlines()
          hits=[i for i,line in enumerate(lines) if 'tests/browser/data-transfer-race.spec.mjs' in line and ('1)' in line or 'failed' in line.lower())]
          excerpts=[]
          for i in hits[-2:]:
              excerpts.extend(lines[max(0,i-2):min(len(lines),i+32)])
          text='\n'.join(excerpts)[-10000:] or 'No detailed error located in the job log.'
          text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print('::notice file=source/AI-Syed-Jalal-FINAL-RECOVERED/tests/browser/data-transfer-race.spec.mjs,line=1,title=Playwright failure details::'+text)
          PY
