name: Test and retain the signed Android candidate

# This one-time branch workflow tests only public, locally signed APK bytes.
# The private signing key never leaves the owner's private workspace. Emulator
# tests do not exercise a physical installer, Play Protect, login or the backend.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-candidate-release.yml']

permissions:
  contents: read

jobs:
  signed-emulator:
    name: Signed APK on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, arch: x86 }
          - { api: 30, arch: x86_64 }
          - { api: 35, arch: x86_64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Retrieve and verify the exact locally signed public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/40489af4bc0dbc2991dfd05ceabb6203a90fdde1" --jq .content | base64 -d > "$RUNNER_TEMP/candidate.apk"
          echo '5a526457a27d3dcb02543427df1190e4081e72d96c22fbecd10b833701303b52  '"$RUNNER_TEMP/candidate.apk" | sha256sum -c -
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$RUNNER_TEMP/candidate.apk" > "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'certificate SHA-256 digest: 7cee6a85c1335f20038c5e4d405495dde6444bb23a18f3a172e03391abb79eea' "$RUNNER_TEMP/signature.txt"
          "$TOOLS/zipalign" -c -p 4 "$RUNNER_TEMP/candidate.apk"
          "$TOOLS/aapt" dump badging "$RUNNER_TEMP/candidate.apk" > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='dev.pages.ai_syed_jalal_live.mobile' versionCode='2'" "$RUNNER_TEMP/badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"; then echo 'Candidate must not be debuggable' >&2; exit 1; fi
          "$TOOLS/aapt" dump xmltree "$RUNNER_TEMP/candidate.apk" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -F 'dev.pages.ai_syed_jalal_live.twa.SafeLauncherActivity' "$RUNNER_TEMP/manifest.txt"
          grep -F 'com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity' "$RUNNER_TEMP/manifest.txt"
          "$TOOLS/aapt" dump permissions "$RUNNER_TEMP/candidate.apk" > "$RUNNER_TEMP/permissions.txt"
          if grep -E 'android[.]permission[.](POST_NOTIFICATIONS|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_[A-Z_]+|ACCESS_MEDIA_LOCATION|MANAGE_MEDIA|RECORD_AUDIO|WAKE_LOCK|RECEIVE_BOOT_COMPLETED|FOREGROUND_SERVICE[A-Z_]*)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected sensitive or background permission' >&2; exit 1
          fi
      - name: Download the previous debug APK for the side-by-side install test
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/releases/download/android-test-apk-retained-v1/AI-Syed-Jalal-test-debug.apk' -o "$RUNNER_TEMP/old.apk"
          echo '0cc60099f598a6bf0b67a7f5d8831c51a072ce599a6c1ea7e4cb45c2ef597ad0  '"$RUNNER_TEMP/old.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and open the signed APK on a disposable Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_PATH: ${{ runner.temp }}/candidate.apk
          OLD_APK_PATH: ${{ runner.temp }}/old.apk
          DIAGNOSTICS_DIR: ${{ runner.temp }}/signed-android-smoke
          API_LABEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/tests/smoke-launch.sh
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed-candidate-evidence-api-${{ matrix.api }}
          path: ${{ runner.temp }}/signed-android-smoke/
          if-no-files-found: ignore
          retention-days: 7
  retain:
    name: Retain tested candidate as a prerelease
    needs: signed-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the exact signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-mobile-1.0.1-candidate-v2
          source_commit=e9a98aa11cc030a335cd994c4556edbca4aab590
          apk="$RUNNER_TEMP/AI-Syed-Jalal-App-1.0.1.apk"
          # Never silently replace an existing release or reuse an existing tag.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref')
          if printf '%s\n' "$refs" | grep -Fxq "refs/tags/$tag"; then
            echo 'Candidate tag already exists; refusing to replace or reuse it.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/40489af4bc0dbc2991dfd05ceabb6203a90fdde1" --jq .content | base64 -d > "$apk"
          echo '5a526457a27d3dcb02543427df1190e4081e72d96c22fbecd10b833701303b52  '"$apk" | sha256sum -c -
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          **Release-signed test candidate; not a Google Play release or a guarantee that installation warnings disappear.**

          This APK fixes a reproduced launch crash caused by a missing Android Browser Helper component. The exact signed APK was installed alongside the previous debug APK and opened the public homepage on disposable Android 8, Android 11 and Android 15 emulators. The tests also checked relaunch and behavior with Chrome disabled. Those tests used `adb`, which does not reproduce a physical phone's installer or Play Protect warnings. No physical-device test or Google approval has occurred.

          This is a Trusted Web Activity: it opens the website in a compatible browser, not an independent native AI backend. The provisional package `dev.pages.ai_syed_jalal_live.mobile` is separate from the old `.twa` debug package, so the old app need not be uninstalled to try it. If a compatible browser is unavailable, the app explains that one is needed. The app and website rely on the same backend; the last readiness check reported only 13 of 24 required table names, so some features may fail. No database migration was performed for this release.

          The certificate fingerprint and source association are public; the private signing key is not part of this APK or repository. Digital Asset Links deployment and physical verification must be checked separately. Availability of this GitHub release depends on GitHub and the repository.

          Android source used to build the unsigned APK: commit `e9a98aa11cc030a335cd994c4556edbca4aab590`. SHA-256 is in the accompanying file.
          NOTES
          gh release create "$tag" "$apk" "$apk.sha256" -R "$GITHUB_REPOSITORY" --target "$source_commit" --prerelease --title 'Android 1.0.1 — signed test candidate, not Play release' --notes-file "$RUNNER_TEMP/release-notes.md"
