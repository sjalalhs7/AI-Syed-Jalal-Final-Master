name: Inspect disposable record-test evidence

on:
  push:
    branches: ['arena/10afe7a1-ai-syed-jalal-final-master']
    paths: ['.github/workflows/record-test-diagnostics.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download disposable browser-test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-test-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: 43565655209
      - name: Summarize sanitized record-edit trace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          from zipfile import ZipFile
          import json

          def editor_state(snapshots, index):
              cache = {}
              def nodes_for(i):
                  if i in cache:
                      return cache[i]
                  nodes = []
                  def collect(node):
                      if isinstance(node, str):
                          nodes.append(node)
                      elif isinstance(node, list) and node and isinstance(node[0], str):
                          for child in node[2:]:
                              collect(child)
                          nodes.append(node)
                  collect(snapshots[i]['html'])
                  cache[i] = nodes
                  return nodes
              found = {}
              def walk(node, i):
                  if not isinstance(node, list) or not node:
                      return
                  if isinstance(node[0], list):
                      back, number = node[0]
                      if i - back >= 0:
                          pool = nodes_for(i - back)
                          if number < len(pool):
                              walk(pool[number], i - back)
                  elif isinstance(node[0], str):
                      attrs = node[1] if len(node) > 1 and isinstance(node[1], dict) else {}
                      identity = attrs.get('id')
                      if identity == 'modal':
                          found['modalHidden'] = 'hidden' in attrs.get('class', '').split()
                      elif identity == 'fNotes':
                          value = attrs.get('__playwright_value_', '')
                          found['notes'] = 'updated' if value == 'Updated concurrently' else 'original' if value == 'Original' else 'other-or-empty'
                      elif identity == 'recordFormStatus':
                          text = ''.join(x for x in node[2:] if isinstance(x, str))
                          found['conflictShown'] = 'your edit was not saved' in text
                      elif identity == 'toast':
                          text = ''.join(x for x in node[2:] if isinstance(x, str))
                          found['toastHasText'] = bool(text)
                      for child in node[2:]:
                          walk(child, i)
              walk(snapshots[index]['html'], index)
              return found

          matches = []
          for path in Path('evidence').rglob('*.zip'):
              with ZipFile(path) as archive:
                  events = []
                  for name in archive.namelist():
                      if name.endswith('.trace'):
                          for line in archive.read(name).decode('utf-8').splitlines():
                              try:
                                  events.append(json.loads(line))
                              except json.JSONDecodeError:
                                  pass
                  if not any('individual edits reject concurrent changes' in str(e.get('title', '')) for e in events):
                      continue
                  network = []
                  for name in archive.namelist():
                      if not name.endswith('.network'):
                          continue
                      for line in archive.read(name).decode('utf-8').splitlines():
                          try:
                              snap = json.loads(line).get('snapshot', {})
                          except json.JSONDecodeError:
                              continue
                          request, response = snap.get('request', {}), snap.get('response', {})
                          if not urlsplit(request.get('url', '')).path.startswith('/api/records/CONCURRENT-'):
                              continue
                          entry = {'method': request.get('method'), 'status': response.get('status'),
                                   'startMs': snap.get('_monotonicTime'), 'durationMs': snap.get('time')}
                          try:
                              body = json.loads(archive.read(response.get('content', {}).get('_file', '')).decode('utf-8'))
                              record = body.get('record') or {}
                              notes = record.get('notes')
                              entry['notes'] = 'updated' if notes == 'Updated concurrently' else 'original' if notes == 'Original' else 'other-or-absent'
                              entry['hasVersion'] = isinstance(record.get('version'), str)
                              entry['conflict'] = body.get('code') == 'RECORD_CONFLICT'
                          except (KeyError, ValueError, TypeError):
                              entry['bodyReadable'] = False
                          network.append(entry)
                  ends = {e.get('callId'): e for e in events if e.get('type') == 'after'}
                  calls, failed_notes = [], set()
                  for e in events:
                      if e.get('type') != 'before' or e.get('class') != 'Frame':
                          continue
                      method, selector = e.get('method'), str((e.get('params') or {}).get('selector', ''))
                      kind = ('edit-click' if method == 'click' and 'Edit' in selector else
                              'close-click' if method == 'click' and '#closeModal' in selector else
                              'submit-click' if method == 'click' and '#recordForm button' in selector else
                              'notes-assertion' if method == 'expect' and '#fNotes' in selector else
                              'status-assertion' if method == 'expect' and '#recordFormStatus' in selector else None)
                      if kind:
                          end = ends.get(e.get('callId'), {})
                          calls.append({'kind': kind, 'startMs': e.get('startTime'),
                                        'endMs': end.get('endTime'), 'error': bool(end.get('error'))})
                          if kind == 'notes-assertion' and end.get('error'):
                              failed_notes.add(e.get('callId'))
                  frames = {}
                  for e in events:
                      if e.get('type') == 'frame-snapshot':
                          snap = e['snapshot']
                          frames.setdefault(snap['frameId'], []).append(snap)
                  editor = []
                  for snapshots in frames.values():
                      for index, snap in enumerate(snapshots):
                          if snap.get('callId') in failed_notes:
                              editor.append({'phase': snap.get('phase'), **editor_state(snapshots, index)})
                  console = [e.get('time') for e in events if e.get('type') == 'console' and e.get('messageType') == 'error']
                  matches.append({'network': network, 'calls': calls, 'editor': editor, 'consoleErrorTimes': console})
          print('::notice title=Disposable record trace::' + json.dumps({'matches': matches}, separators=(',', ':')))
          if not matches:
              raise SystemExit('No matching disposable record trace found')
          PY
