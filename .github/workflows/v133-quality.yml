name: V133 unified app quality

on:
  push:
    branches:
      - main
      - 'arena/**'
      - fix/audit-v129-2026-11-02
      - fix/dependency-audit-2026-11-02
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v133-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: source/AI-Syed-Jalal-FINAL-RECOVERED/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix source/AI-Syed-Jalal-FINAL-RECOVERED ci --no-audit --no-fund

      - name: Audit direct and transitive dependencies
        run: npm --prefix source/AI-Syed-Jalal-FINAL-RECOVERED audit --audit-level=high

      # Split on purpose: when one suite fails, the failing step names it.
      - name: Run frontend contract tests
        run: npm --prefix source/AI-Syed-Jalal-FINAL-RECOVERED/frontend test

      # Publishes failures as annotations: during this GitHub incident the
      # Actions log/artifact APIs return EOF, and annotations still work.
      - name: Run server and integration tests
        shell: bash
        run: |
          set -uo pipefail
          cd source/AI-Syed-Jalal-FINAL-RECOVERED
          status=0
          for f in server/tests/*.test.mjs; do
            if ! node --test --test-concurrency=1 "$f" > /tmp/out.txt 2>&1; then
              status=1
              echo "::error title=suite failed::$f"
              grep -E 'not ok|^# (pass|fail)|rror|expected|actual' /tmp/out.txt | head -30 |
                sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done
              tail -30 /tmp/out.txt | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::TAIL $line"; done
            fi
          done
          exit $status

      - name: Run static application checks
        run: npm --prefix source/AI-Syed-Jalal-FINAL-RECOVERED run check

      - name: Verify the generated skill index is current and complete
        shell: bash
        run: |
          set -euo pipefail
          app="source/AI-Syed-Jalal-FINAL-RECOVERED"
          cp "$app/frontend/config/agent-skill-index.json" /tmp/agent-skill-index.committed.json
          node "$app/scripts/build-skill-index.mjs"
          cmp -s /tmp/agent-skill-index.committed.json "$app/frontend/config/agent-skill-index.json"
          node -e "
            const index = require('./$app/frontend/config/agent-skill-index.json');
            if (index.count !== 3500 || index.skills.length !== 3500) throw new Error('Skill index is incomplete: ' + index.count);
            if (index.domainCount !== 35) throw new Error('Skill index domains: ' + index.domainCount);
            console.log('Skill index verified:', index.count, 'skills across', index.domainCount, 'domains');
          "

      - name: Verify recovery archive safely
        run: python3 -m unittest discover -s tests -v

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          root="source/AI-Syed-Jalal-FINAL-RECOVERED"
          find "$root/backend" "$root/frontend/functions" "$root/worker" "$root/server" "$root/tests" "$root/scripts" -type f \( -name '*.mjs' -o -name '*.js' \) -print0 |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Check SQL migrations are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find source/AI-Syed-Jalal-FINAL-RECOVERED/backend/db/migrations -maxdepth 1 -type f -name '*.sql' -print -quit)"
          for file in source/AI-Syed-Jalal-FINAL-RECOVERED/backend/db/migrations/*.sql; do
            test -s "$file"
          done
