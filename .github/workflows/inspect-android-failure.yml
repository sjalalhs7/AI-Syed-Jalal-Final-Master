name: Inspect synthetic Android first-run screen

# One-off inspection using disposable emulator data; remove after use.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/inspect-android-failure.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the failed synthetic API 30 UI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-launch-evidence-api-30
          run-id: 43355783343
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/android-evidence
      - name: Report first-run control geometry without account data
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/android-evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, xml.etree.ElementTree as ET
          rootdir = pathlib.Path(os.environ['EVIDENCE_DIR'])
          files = list(rootdir.rglob('launch.xml'))
          if len(files) != 1:
              raise SystemExit('Expected exactly one disposable emulator launch UI file')
          tree = ET.parse(files[0]).getroot()
          parents = {child: parent for parent in tree.iter() for child in parent}
          allowed = {value.casefold() for value in ('Use without an account', 'Accept & continue', 'Accept and continue', 'Continue without an account', 'No thanks', 'No, thanks', 'Got it', 'Next', 'Skip')}
          fields = ('class', 'resource-id', 'text', 'content-desc', 'bounds', 'enabled', 'clickable', 'focusable', 'visible-to-user')
          def attrs(node):
              return {key: node.get(key) for key in fields if node.get(key)}
          def notice(title, message):
              text = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title={title}::{text}')
          matches = [node for node in tree.iter('node') if node.get('text', '').strip().casefold() in allowed]
          notice('Synthetic first-run match count', str(len(matches)))
          for i, node in enumerate(matches[:5]):
              chain = []
              current = node
              for _ in range(4):
                  if current is None: break
                  chain.append(attrs(current))
                  current = parents.get(current)
              notice(f'Synthetic first-run match {i + 1}', json.dumps(chain, separators=(',', ':')))
              m = re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.get('bounds', ''))
              if m:
                  x1, y1, x2, y2 = map(int, m.groups())
                  notice(f'Synthetic first-run tap {i + 1}', f'center={(x1+x2)//2},{(y1+y2)//2}; extent={x2-x1}x{y2-y1}')
          PY
  trace-api-30:
    name: Trace API 30 first-run attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the same debug candidate used by the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-launch-regression-apk
          run-id: 43355783343
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Download and verify the previously delivered APK
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/releases/download/android-test-apk-retained-v1/AI-Syed-Jalal-test-debug.apk' -o "$RUNNER_TEMP/old.apk"
          echo '0cc60099f598a6bf0b67a7f5d8831c51a072ce599a6c1ea7e4cb45c2ef597ad0  '"$RUNNER_TEMP/old.apk" | sha256sum -c -
      - name: Make a temporary traced copy of the smoke test
        run: |
          python3 - <<'PY'
          import os, pathlib
          source = pathlib.Path('android/tests/smoke-launch.sh').read_text()
          old = '    dump_ui "$phase" || continue\n'
          new = '    if ! dump_ui "$phase"; then notice "Synthetic API 30 UI dump" "$phase attempt $attempt could not be read"; continue; fi\n    notice "Synthetic API 30 $phase attempt $attempt" "$(ui_summary "$phase")"\n'
          assert source.count(old) == 1
          source = source.replace(old, new)
          old = '    adb shell input tap $point\n'
          new = '    notice "Synthetic API 30 first-run tap" "$point"\n    adb shell input tap $point\n'
          assert source.count(old) == 1
          source = source.replace(old, new)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'smoke-trace.sh').write_text(source)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Trace the same install and first-run checks
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_PATH: ${{ runner.temp }}/candidate/app-debug.apk
          OLD_APK_PATH: ${{ runner.temp }}/old.apk
          DIAGNOSTICS_DIR: ${{ runner.temp }}/android-trace
          API_LABEL: 30
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/smoke-trace.sh"
      - name: Preserve synthetic Android traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-trace-api-30-${{ matrix.attempt }}
          path: ${{ runner.temp }}/android-trace/
          if-no-files-found: ignore
          retention-days: 7
