name: Inspect synthetic deletion traces

# Temporary inspection of disposable browser test artifacts; remove afterward.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/inspect-delete-traces.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect synthetic run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        run: [43359071662, 43358001515]
    steps:
      - name: Download the disposable browser evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-test-evidence
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/browser-evidence
      - name: Summarize only synthetic request methods, statuses, and route events
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/browser-evidence
        run: |
          python3 - <<'PY'
          import collections, json, os, pathlib, urllib.parse, zipfile
          root = pathlib.Path(os.environ['EVIDENCE_DIR'])
          traces = list(root.rglob('trace.zip'))
          if len(traces) != 1:
              raise SystemExit(f'Expected one disposable trace, found {len(traces)}')
          def notice(title, value):
              text=json.dumps(value, separators=(',', ':'), ensure_ascii=True)
              text=text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title={title}::{text}')
          with zipfile.ZipFile(traces[0]) as z:
              network=[]; events=[]
              for name in z.namelist():
                  if not name.endswith(('.network', '.trace')) or name == 'test.trace': continue
                  for line in z.read(name).decode('utf-8').splitlines():
                      if not line.strip(): continue
                      e=json.loads(line)
                      if name.endswith('.network') and e.get('type') == 'resource-snapshot':
                          s=e.get('snapshot', {}); req=s.get('request', {}); res=s.get('response', {})
                          path=urllib.parse.urlsplit(req.get('url', '')).path
                          if path.startswith('/api/records/'):
                              network.append({'method':req.get('method'), 'path':'/api/records/{id}', 'status':res.get('status'), 'aborted':s.get('_wasAborted'), 'fromWorker':res.get('_fromServiceWorker'), 'time':s.get('_monotonicTime')})
                      if name.endswith('.trace') and e.get('type') == 'before':
                          kind=e.get('class'); method=e.get('method')
                          if kind=='Route' and method in ('abort', 'continue', 'fulfill'):
                              events.append({'class':kind, 'method':method, 'time':e.get('startTime')})
                          elif kind=='Page' and method in ('reload', 'setNetworkInterceptionPatterns'):
                              events.append({'class':kind, 'method':method, 'time':e.get('startTime')})
                          elif kind=='Frame' and method=='click' and 'dataBody' in e.get('params',{}).get('selector',''):
                              events.append({'class':kind, 'method':'delete-row click', 'time':e.get('startTime')})
              notice('Synthetic record request events', network)
              notice('Synthetic interception and click events', events)
          PY
