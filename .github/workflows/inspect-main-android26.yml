name: Inspect synthetic Android 8 evidence

# Temporary read-only inspection of an emulator artifact; remove afterward.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/inspect-main-android26.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the disposable emulator evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-launch-evidence-api-26
          run-id: 43371185796
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/android-evidence
      - name: Summarize synthetic launch and crash evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/android-evidence
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIR'])
          files={p.name:p for p in root.rglob('*') if p.is_file()}
          def notice(title, value):
              text=json.dumps(value, ensure_ascii=True, separators=(',', ':'))
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={title}::{text}')
          notice('Synthetic emulator evidence files', {name:p.stat().st_size for name,p in sorted(files.items())})
          for name in ('launch-start.txt','relaunch-start.txt','external-intent-start.txt','external-intent-filter.txt'):
              if name in files:
                  notice('Synthetic '+name, files[name].read_text(errors='replace')[:3000])
          for name in ('launch-progress.txt','relaunch-progress.txt','external-intent-progress.txt'):
              if name in files:
                  lines=files[name].read_text(errors='replace').splitlines()
                  # Keep only the attempt and tap information, not page content.
                  notice('Synthetic '+name, [line.split(' packages=')[0] for line in lines[-6:]])
          for name in ('launch-logcat.txt','relaunch-logcat.txt','external-intent-logcat.txt'):
              if name in files:
                  text=files[name].read_text(errors='replace')
                  crashes=[]
                  for segment in text.split('FATAL EXCEPTION:')[1:]:
                      if 'Process: dev.pages.ai_syed_jalal_live.mobile,' in segment[:1200]:
                          crashes.append(segment[:1500])
                  notice('Synthetic '+name, {'bytes':len(text.encode()),'candidateCrashes':crashes})
          PY
