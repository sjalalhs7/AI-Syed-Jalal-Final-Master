name: Recheck Android 8 with retained test APKs

# Temporary, read-only diagnostic: public homepage and disposable emulators only.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/inspect-android8-recheck.yml']

permissions:
  actions: read
  contents: read

jobs:
  recheck:
    name: Android 8 ${{ matrix.variant }} attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [main-debug, signed-candidate]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check the smoke diagnostic helpers
        run: bash android/tests/test-smoke-diagnostics.sh
      - name: Retrieve the exact debug APK from the main run
        if: matrix.variant == 'main-debug'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-launch-regression-apk
          run-id: 43371185796
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Retrieve and verify the exact public signed candidate
        if: matrix.variant == 'signed-candidate'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          curl --retry 3 -fsSL 'https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/releases/download/android-mobile-1.0.2-candidate-v1/AI-Syed-Jalal-App-1.0.2.apk' -o "$RUNNER_TEMP/candidate/app-debug.apk"
          echo 'bece1bcc562a1a58842f8af8573dde098244055d601bf9743d3d2e093026ee1d  '"$RUNNER_TEMP/candidate/app-debug.apk" | sha256sum -c -
      - name: Report the tested APK fingerprint and verify the old APK
        run: |
          set -euo pipefail
          echo "::notice title=Tested APK SHA-256::$(sha256sum "$RUNNER_TEMP/candidate/app-debug.apk" | cut -d' ' -f1)"
          curl --retry 3 -fsSL 'https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/releases/download/android-test-apk-retained-v1/AI-Syed-Jalal-test-debug.apk' -o "$RUNNER_TEMP/old.apk"
          echo '0cc60099f598a6bf0b67a7f5d8831c51a072ce599a6c1ea7e4cb45c2ef597ad0  '"$RUNNER_TEMP/old.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, render, relaunch and test URL and browser fallback
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_PATH: ${{ runner.temp }}/candidate/app-debug.apk
          OLD_APK_PATH: ${{ runner.temp }}/old.apk
          DIAGNOSTICS_DIR: ${{ runner.temp }}/android-smoke
          API_LABEL: '26'
        with:
          api-level: 26
          target: google_apis_playstore
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/tests/smoke-launch.sh
      - name: Summarize synthetic evidence when a recheck fails
        if: failure()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/android-smoke
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['EVIDENCE_DIR'])
          files={p.name:p for p in root.rglob('*') if p.is_file()} if root.exists() else {}
          def notice(title, value):
              text=json.dumps(value,ensure_ascii=True,separators=(',', ':'))
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice title={title}::{text}')
          notice('Synthetic evidence files', {name:p.stat().st_size for name,p in sorted(files.items())})
          for name in ('launch-start.txt','relaunch-start.txt','external-intent-start.txt','no-chrome-start.txt'):
              if name in files: notice('Synthetic '+name,files[name].read_text(errors='replace')[:1500])
          for name in ('launch-progress.txt','relaunch-progress.txt','external-intent-progress.txt'):
              if name in files:
                  lines=files[name].read_text(errors='replace').splitlines()
                  notice('Synthetic '+name,[line.split(' packages=')[0] for line in lines[-6:]])
          for name in ('launch-logcat.txt','relaunch-logcat.txt','external-intent-logcat.txt','no-chrome-logcat.txt'):
              if name in files:
                  text=files[name].read_text(errors='replace')
                  crashes=[segment[:1500] for segment in text.split('FATAL EXCEPTION:')[1:] if 'Process: dev.pages.ai_syed_jalal_live.mobile,' in segment[:1200]]
                  notice('Synthetic '+name,{'bytes':len(text.encode()),'candidateCrashes':crashes})
          PY
      - name: Preserve synthetic emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android8-${{ matrix.variant }}-attempt-${{ matrix.attempt }}
          path: ${{ runner.temp }}/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
