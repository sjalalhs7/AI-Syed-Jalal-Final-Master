name: Recovery backend source checks

on:
  push:
    branches:
      - recovery/data-upgrade-2026-10-22
  pull_request:
    branches:
      - recovery/data-upgrade-2026-10-22
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-backend-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/AI-Syed-Jalal-FINAL-RECOVERED/backend
    steps:
      - name: Check out recovery source
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: source/AI-Syed-Jalal-FINAL-RECOVERED/backend/package.json
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate server syntax
        run: node --check server.mjs
      - name: Run backend quality gate
        run: npm run quality
      - name: Run V75 final contract checks
        run: npm run v75-final
      - name: Run V75 agency integration checks
        run: npm run v75-agency
      - name: Run Wikipedia adapter checks
        run: npm run wikipedia-adapter
      - name: Run capability contract checks
        run: npm run capability-contracts
