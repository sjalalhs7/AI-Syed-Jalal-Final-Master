name: Android launch regression

# The emulator visits only the public homepage, with no account credentials.
# Installing via adb does not exercise Play Protect or a real device's installer.
on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - 'source/AI-Syed-Jalal-FINAL-RECOVERED/frontend/.well-known/assetlinks.json'
      - '.github/workflows/android-launch-diagnostics.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'source/AI-Syed-Jalal-FINAL-RECOVERED/frontend/.well-known/assetlinks.json'
      - '.github/workflows/android-launch-diagnostics.yml'
  workflow_dispatch:
    inputs:
      association_only:
        description: 'Check only the live association (select main)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  production-association:
    name: Verify live Android association
    # Only a main-branch deployment can serve this exact public origin.
    # On manual dispatch, fail explicitly rather than silently skip if an
    # association-only check was requested from a different branch. This GET
    # does not read or change the production database.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || inputs.association_only == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main for a live association check
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Select main when requesting the live association check.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for the live HTTPS association to match this source
        run: |
          set -euo pipefail
          expected='source/AI-Syed-Jalal-FINAL-RECOVERED/frontend/.well-known/assetlinks.json'
          for attempt in $(seq 1 36); do
            if curl --silent --show-error --fail --max-time 10 \
                -D "$RUNNER_TEMP/headers.txt" -o "$RUNNER_TEMP/assetlinks.json" \
                'https://ai-syed-jalal-live.pages.dev/.well-known/assetlinks.json'; then
              if python3 - "$RUNNER_TEMP/headers.txt" "$RUNNER_TEMP/assetlinks.json" "$expected" <<'PY'
          import json, pathlib, sys
          headers=pathlib.Path(sys.argv[1]).read_text().splitlines()
          statuses=[line for line in headers if line.startswith('HTTP/')]
          if not statuses or statuses[-1].split()[1] != '200': raise SystemExit('Association did not return HTTP 200 without a redirect')
          if not any(line.lower().startswith('content-type: application/json') for line in headers): raise SystemExit('Association response is not JSON')
          if json.loads(pathlib.Path(sys.argv[2]).read_text()) != json.loads(pathlib.Path(sys.argv[3]).read_text()): raise SystemExit('Live association does not match this source yet')
          PY
              then
                echo '::notice file=android/README.md,line=1,title=Live Android association::The live origin returned the expected association JSON without a redirect.'
                exit 0
              fi
            fi
            sleep 10
          done
          echo '::error file=android/README.md,line=1::The live Android association was not confirmed after deployment.'
          exit 1
  build:
    # A main-only association recheck should not need another emulator build.
    if: github.event_name != 'workflow_dispatch' || inputs.association_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test smoke failure diagnostics without an emulator
        run: bash android/tests/test-smoke-diagnostics.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Assemble the candidate debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-regression-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  emulator:
    name: Launch on Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Android 8's Play Store image is x86, while the newer images are x86_64.
      # Using x86_64 for API 26 fails before the emulator even starts.
      matrix:
        include:
          - { api: 26, arch: x86 }
          - { api: 30, arch: x86_64 }
          - { api: 35, arch: x86_64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-launch-regression-apk
          path: ${{ runner.temp }}/candidate
      - name: Download and verify the previously delivered APK for side-by-side install
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/releases/download/android-test-apk-retained-v1/AI-Syed-Jalal-test-debug.apk' -o "$RUNNER_TEMP/old.apk"
          echo '0cc60099f598a6bf0b67a7f5d8831c51a072ce599a6c1ea7e4cb45c2ef597ad0  '"$RUNNER_TEMP/old.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, render, relaunch and check missing-browser behavior
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_PATH: ${{ runner.temp }}/candidate/app-debug.apk
          OLD_APK_PATH: ${{ runner.temp }}/old.apk
          DIAGNOSTICS_DIR: ${{ runner.temp }}/android-smoke
          API_LABEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: ${{ matrix.arch }}
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/tests/smoke-launch.sh
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-evidence-api-${{ matrix.api }}
          path: ${{ runner.temp }}/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
