name: Android launch regression

# The emulator visits only the public homepage, with no account credentials.
# Installing via adb does not exercise Play Protect or a real device's installer.
on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-launch-diagnostics.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-launch-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Assemble the candidate debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-regression-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  emulator:
    name: Launch on Android API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # The API 26 emulator setup did not complete on the hosted runner;
      # only the listed API levels are counted as exercised here.
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-launch-regression-apk
          path: ${{ runner.temp }}/candidate
      - name: Download and verify the previously delivered APK for side-by-side install
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/releases/download/android-test-apk-retained-v1/AI-Syed-Jalal-test-debug.apk' -o "$RUNNER_TEMP/old.apk"
          echo '0cc60099f598a6bf0b67a7f5d8831c51a072ce599a6c1ea7e4cb45c2ef597ad0  '"$RUNNER_TEMP/old.apk" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, render, relaunch and check missing-browser behavior
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          APK_PATH: ${{ runner.temp }}/candidate/app-debug.apk
          OLD_APK_PATH: ${{ runner.temp }}/old.apk
          DIAGNOSTICS_DIR: ${{ runner.temp }}/android-smoke
          API_LABEL: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/tests/smoke-launch.sh
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-launch-evidence-api-${{ matrix.api }}
          path: ${{ runner.temp }}/android-smoke/
          if-no-files-found: ignore
          retention-days: 7
