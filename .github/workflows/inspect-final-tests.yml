name: Inspect final synthetic test failures

# One-time branch diagnostic: all artifacts were produced by isolated tests.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/inspect-final-tests.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect the Operations test's synthetic response and DOM snapshots
        run: |
          set -euo pipefail
          gh run download 43284426615 -R "$GITHUB_REPOSITORY" -n browser-test-evidence -D "$RUNNER_TEMP/web-evidence"
          python3 - "$RUNNER_TEMP/web-evidence" <<'PY'
          from pathlib import Path
          import json, sys, zipfile
          root=Path(sys.argv[1])
          def notice(title,text):
              text=text[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice file=source/AI-Syed-Jalal-FINAL-RECOVERED/tests/browser/workspace-initialization.spec.mjs,line=73,title={title}::{text}')
          traces=[p for p in root.rglob('trace.zip') if 'workspace-initialization' in str(p)]
          assert traces, 'No Operations trace found'
          for path in traces:
              with zipfile.ZipFile(path) as z:
                  for name in z.namelist():
                      if name.endswith('.network'):
                          for line in z.read(name).splitlines():
                              try: item=json.loads(line)
                              except Exception: continue
                              snap=item.get('snapshot',{}); request=snap.get('request',{})
                              if '/api/ready' not in request.get('url',''): continue
                              response=snap.get('response',{}); content=response.get('content',{})
                              sha=content.get('_sha1'); resource='resources/'+str(sha)
                              body=z.read(resource).decode('utf8','replace')[:700] if sha and resource in z.namelist() else '(body not recorded)'
                              notice('Synthetic readiness response', f"status={response.get('status')} time={snap.get('time')} content={content} body={body}")
                      if name.endswith('.trace'):
                          found=[]
                          def walk(node):
                              if isinstance(node,list):
                                  if len(node)>1 and isinstance(node[1],dict) and node[1].get('id') in ('schemaRepairTag','schemaRepairText','opsDb','opsApi'):
                                      found.append((node[1].get('id'),json.dumps(node,ensure_ascii=False)[:500]))
                                  for child in node: walk(child)
                              elif isinstance(node,dict):
                                  for child in node.values(): walk(child)
                          for line in z.read(name).splitlines():
                              try: item=json.loads(line)
                              except Exception: continue
                              if item.get('type')=='frame-snapshot': walk(item.get('snapshot',{}).get('html'))
                          for key in ('schemaRepairTag','schemaRepairText','opsDb','opsApi'):
                              values=[value for ident,value in found if ident==key]
                              notice('Synthetic DOM '+key, '\n'.join(values[-4:]) or 'No matching inline snapshot node')
          PY
      - name: Inspect the cancelled Android 11 signed test
        run: |
          set -euo pipefail
          gh run view 43281505969 -R "$GITHUB_REPOSITORY" --job 131403664192 --log > "$RUNNER_TEMP/android.log"
          gh run download 43281505969 -R "$GITHUB_REPOSITORY" -n android-signed-candidate-evidence-api-30 -D "$RUNNER_TEMP/android-evidence"
          python3 - "$RUNNER_TEMP/android.log" "$RUNNER_TEMP/android-evidence" <<'PY'
          from pathlib import Path
          import sys
          def notice(title,text):
              text=text[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice file=android/README.md,line=1,title={title}::{text}')
          root=Path(sys.argv[2]); notice('Android 11 evidence files', ', '.join(p.name for p in root.iterdir()))
          for name in ('external-intent-start.txt','external-intent-filter.txt','relaunch-logcat.txt'):
              p=root/name
              notice('Android 11 '+name, p.read_text(encoding='utf8',errors='replace')[-3000:] if p.exists() else '(not present)')
          lines=Path(sys.argv[1]).read_text(encoding='utf8',errors='replace').splitlines()
          notice('Android 11 final log lines', '\n'.join(line[-350:] for line in lines[-18:]))
          PY
