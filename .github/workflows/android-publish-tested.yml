name: Retain the tested signed APK

# One-time public draft publication. This handles only the already tested APK,
# never the private signing key. Publication is completed separately after the
# release assets are verified.
on:
  push:
    branches: ['arena/8412eff6-ai-syed-jalal-final-master']
    paths: ['.github/workflows/android-publish-tested.yml']

permissions:
  actions: read
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the three exact-byte emulator checks
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/43261909006" --jq .head_sha)" = 49784454bc84982409b26df254c55eee2e69a922
          gh api "repos/$GH_REPO/actions/runs/43261909006/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          for api in 26 30 35; do
            jq -e --arg name "Signed APK on Android API $api" '[.jobs[] | select(.name == $name and .conclusion == "success")] | length == 1' "$RUNNER_TEMP/jobs.json" > /dev/null
          done
      - name: Verify the signed APK and create a draft release
        run: |
          set -euo pipefail
          tag=android-mobile-1.0.1-candidate-v2
          apk="$RUNNER_TEMP/AI-Syed-Jalal-App-1.0.1.apk"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq 'length')
          test "$existing" -eq 0
          gh api "repos/$GH_REPO/git/blobs/40489af4bc0dbc2991dfd05ceabb6203a90fdde1" --jq .content | base64 -d > "$apk"
          echo '5a526457a27d3dcb02543427df1190e4081e72d96c22fbecd10b833701303b52  '"$apk" | sha256sum -c -
          tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$apk" > "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'certificate SHA-256 digest: 7cee6a85c1335f20038c5e4d405495dde6444bb23a18f3a172e03391abb79eea' "$RUNNER_TEMP/signature.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          **Release-signed test candidate; not a Google Play release or a guarantee that installation warnings disappear.**

          This APK fixes a reproduced launch crash caused by a missing Android Browser Helper component. The exact signed APK was installed alongside the previous debug APK and opened the public homepage on disposable Android 8, Android 11 and Android 15 emulators. The tests also checked relaunch and behavior with Chrome disabled. Those tests used `adb`, which does not reproduce a physical phone's installer or Play Protect warnings. No physical-device test or Google approval has occurred. The prior debug APK is known to crash and should not be used.

          This is a Trusted Web Activity: it opens the website in a compatible browser, not an independent native AI backend. The provisional package `dev.pages.ai_syed_jalal_live.mobile` is separate from the old `.twa` debug package, so the old app need not be uninstalled to try it. If a compatible browser is unavailable, the app explains that one is needed. The app and website rely on the same backend; the last readiness check reported only 13 of 24 required table names, so some features may fail. No database migration was performed for this release.

          The certificate fingerprint and source association are public; the private signing key is not part of this APK or repository. Digital Asset Links deployment and physical verification must be checked separately. Availability of this GitHub release depends on GitHub and the repository; unlike Actions test artifacts, it has no seven-day artifact expiry.

          Android source used to build the unsigned APK: commit `e9a98aa11cc030a335cd994c4556edbca4aab590`. The exact-byte emulator checks are in [workflow run 43261909006](https://github.com/sjalalhs7/AI-Syed-Jalal-Final-Master/actions/runs/43261909006); its publication job was blocked by GitHub Actions permissions after all three emulator jobs passed, so this release was published separately. SHA-256 is in the accompanying file.
          NOTES
          gh release create "$tag" "$apk" "$apk.sha256" --target e9a98aa11cc030a335cd994c4556edbca4aab590 --draft --prerelease --title 'Android 1.0.1 — signed test candidate, not Play release' --notes-file "$RUNNER_TEMP/release-notes.md"
