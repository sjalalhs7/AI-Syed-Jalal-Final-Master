name: Verify the public Android download

# One-time verification; this workflow needs no signing key or write access.
on:
  push:
    branches: ['arena/8412eff6-ai-syed-jalal-final-master']
    paths: ['.github/workflows/android-publish-tested.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and verify the published APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=android-mobile-1.0.1-candidate-v2
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          cd "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.draft == false and .prerelease == true' | grep -Fx true
          curl --retry 3 -fsSL "$base/AI-Syed-Jalal-App-1.0.1.apk" -o AI-Syed-Jalal-App-1.0.1.apk
          curl --retry 3 -fsSL "$base/AI-Syed-Jalal-App-1.0.1.apk.sha256" -o AI-Syed-Jalal-App-1.0.1.apk.sha256
          sha256sum -c AI-Syed-Jalal-App-1.0.1.apk.sha256
          echo '5a526457a27d3dcb02543427df1190e4081e72d96c22fbecd10b833701303b52  AI-Syed-Jalal-App-1.0.1.apk' | sha256sum -c -
          tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 23 AI-Syed-Jalal-App-1.0.1.apk > signature.txt
          grep -F 'certificate SHA-256 digest: 7cee6a85c1335f20038c5e4d405495dde6444bb23a18f3a172e03391abb79eea' signature.txt
          echo '::notice file=android/README.md,line=1,title=Public APK download::The published release asset downloads and matches the tested signed APK.'
      - name: Verify Digital Asset Links on the Cloudflare preview only
        run: |
          set -euo pipefail
          curl --retry 3 -fsS -D "$RUNNER_TEMP/headers.txt" -o "$RUNNER_TEMP/assetlinks.json" 'https://527910d8.ai-syed-jalal-live.pages.dev/.well-known/assetlinks.json'
          python3 - "$RUNNER_TEMP/headers.txt" "$RUNNER_TEMP/assetlinks.json" <<'PY'
          import json, pathlib, sys
          headers=pathlib.Path(sys.argv[1]).read_text().splitlines()
          assert headers[0].split()[1] == '200', headers[0]
          assert any(line.lower().startswith('content-type: application/json') for line in headers), headers
          links=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert any(link.get('target',{}).get('package_name') == 'dev.pages.ai_syed_jalal_live.mobile' and '7C:EE:6A:85:C1:33:5F:20:03:8C:5E:4D:40:54:95:DD:E6:44:4B:B2:3A:18:F3:A1:72:E0:33:91:AB:B7:9E:EA' in link.get('target',{}).get('sha256_cert_fingerprints',[]) for link in links)
          print('::notice file=android/README.md,line=1,title=Preview association::The preview returned matching JSON without a redirect; this does not verify the live origin.')
          PY
