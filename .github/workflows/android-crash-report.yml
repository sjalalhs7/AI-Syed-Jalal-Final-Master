name: Inspect previous Android crash

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-crash-report.yml']

permissions:
  contents: read
  actions: read

jobs:
  crash:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the disposable-emulator crash log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43253513036 -R "$GITHUB_REPOSITORY" -n android-old-apk-diagnostics-api-35 -D "$RUNNER_TEMP/old-crash"
          python3 - "$RUNNER_TEMP/old-crash/logcat.txt" <<'PY'
          import sys
          lines = open(sys.argv[1], encoding='utf8', errors='replace').read().splitlines()
          for i, line in enumerate(lines):
              if 'FATAL EXCEPTION' in line:
                  excerpt = '\n'.join(lines[i:i+30])
                  excerpt = excerpt.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice file=android/README.md,line=1,title=Old APK Android 15 crash::' + excerpt)
                  break
          else:
              print('::error::No fatal exception was present in the retrieved log')
              sys.exit(1)
          PY
