name: Retain and verify Android 1.0.2

# One-time upload to an owner-created, unpublished draft. Only the public APK
# is handled here; the private signing key remains outside GitHub.
on:
  push:
    branches: ['arena/8412eff6-ai-syed-jalal-final-master']
    paths: ['.github/workflows/android-upload-102.yml']

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require exact-byte emulator checks
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/43281505969" --jq .head_sha)" = 9228e3bb22fa3dd016f3000439588b7231d48268
          test "$(gh api "repos/$GH_REPO/actions/runs/43283063776" --jq .head_sha)" = 6ebb9be126026d3507cb56be71d4b5685b29eb9e
          gh api "repos/$GH_REPO/actions/runs/43281505969/jobs?per_page=100" > "$RUNNER_TEMP/main-jobs.json"
          for api in 26 35; do
            jq -e --arg name "Signed APK on Android API $api" '[.jobs[]|select(.name==$name and .conclusion=="success")]|length == 1' "$RUNNER_TEMP/main-jobs.json" > /dev/null
          done
          gh api "repos/$GH_REPO/actions/runs/43283063776/jobs?per_page=100" | jq -e '[.jobs[]|select(.name=="Signed APK on Android API 30" and .conclusion=="success")]|length == 1' > /dev/null
      - name: Upload the verified APK and checksum to the draft
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/AI-Syed-Jalal-App-1.0.2.apk"
          gh api "repos/$GH_REPO/git/blobs/16913002d2333028548278f3df9a4eedd3f295a8" --jq .content | base64 -d > "$apk"
          echo 'bece1bcc562a1a58842f8af8573dde098244055d601bf9743d3d2e093026ee1d  '"$apk" | sha256sum -c -
          tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose --print-certs --min-sdk-version 23 "$apk" > "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/signature.txt"
          grep -F 'certificate SHA-256 digest: 7cee6a85c1335f20038c5e4d405495dde6444bb23a18f3a172e03391abb79eea' "$RUNNER_TEMP/signature.txt"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/vnd.android.package-archive' --data-binary "@$apk" \
            "https://uploads.github.com/repos/$GH_REPO/releases/443373451/assets?name=AI-Syed-Jalal-App-1.0.2.apk" \
            | jq -e 'select(.name=="AI-Syed-Jalal-App-1.0.2.apk" and .digest=="sha256:bece1bcc562a1a58842f8af8573dde098244055d601bf9743d3d2e093026ee1d")|{name,size,digest}'
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: text/plain' --data-binary "@$apk.sha256" \
            "https://uploads.github.com/repos/$GH_REPO/releases/443373451/assets?name=AI-Syed-Jalal-App-1.0.2.apk.sha256" \
            | jq -e 'select(.name=="AI-Syed-Jalal-App-1.0.2.apk.sha256")|{name,size,digest}'
  verify-public:
    name: Verify the public APK download
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for publication and verify public download bytes
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/android-mobile-1.0.2-candidate-v1"
          cd "$RUNNER_TEMP"
          ok=0
          for attempt in $(seq 1 48); do
            if curl --silent --fail --location --max-time 20 "$base/AI-Syed-Jalal-App-1.0.2.apk" -o AI-Syed-Jalal-App-1.0.2.apk \
              && curl --silent --fail --location --max-time 20 "$base/AI-Syed-Jalal-App-1.0.2.apk.sha256" -o AI-Syed-Jalal-App-1.0.2.apk.sha256; then
              ok=1; break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          sha256sum -c AI-Syed-Jalal-App-1.0.2.apk.sha256
          echo 'bece1bcc562a1a58842f8af8573dde098244055d601bf9743d3d2e093026ee1d  AI-Syed-Jalal-App-1.0.2.apk' | sha256sum -c -
          echo '::notice file=android/README.md,line=1,title=Public APK download::The public download matches the emulator-tested signed bytes.'
