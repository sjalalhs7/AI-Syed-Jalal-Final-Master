name: Inspect Android 8 launch test

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-inspect-api26.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the latest Android 8 emulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43258909450 -R "$GITHUB_REPOSITORY" -n android-launch-evidence-api-26 -D "$RUNNER_TEMP/evidence"
          python3 - "$RUNNER_TEMP/evidence" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for name in ('packages.txt','launch-start.txt','install-old.txt','install-new.txt','launch.xml'):
              p=root/name
              if not p.exists():
                  text='Not recorded'
              else:
                  text=p.read_text(encoding='utf8',errors='replace')
                  if name=='packages.txt':
                      text='\n'.join(line for line in text.splitlines() if any(s in line.lower() for s in ('browser','chrome','webview','syed')))
                  elif name=='launch.xml':
                      import re
                      text=' | '.join(re.findall(r'(?:text|content-desc)="([^"]+)"',text))
                  text=text[:5000]
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice file=android/README.md,line=1,title=API26 {name}::{text}')
          PY
