name: Inspect Android 8 browser availability

# One-off diagnostics on a disposable emulator, with no user data.
on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-inspect-api26.yml']

permissions:
  actions: read
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Retrieve the existing debug candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43258909450 -R "$GITHUB_REPOSITORY" -n android-launch-regression-apk -D "$RUNNER_TEMP/candidate"
      - name: Write browser diagnostic script
        run: |
          cat > "$RUNNER_TEMP/browser-probe.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          D="$RUNNER_TEMP/browser-probe"
          mkdir -p "$D"
          adb shell input keyevent 82 || true
          adb install -r "$RUNNER_TEMP/candidate/app-debug.apk" > "$D/install.txt"
          adb shell dumpsys package com.android.chrome > "$D/chrome.txt" || true
          adb shell pm list packages -d > "$D/disabled.txt" || true
          adb shell cmd package query-intent-services -a android.support.customtabs.action.CustomTabsService > "$D/services.txt" 2>&1 || true
          adb shell cmd package query-activities -a android.intent.action.MAIN -c android.intent.category.APP_BROWSER > "$D/browser-apps.txt" 2>&1 || true
          adb shell cmd package resolve-activity -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d https://ai-syed-jalal-live.pages.dev/ > "$D/resolve-view.txt" 2>&1 || true
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n dev.pages.ai_syed_jalal_live.mobile/dev.pages.ai_syed_jalal_live.twa.SafeLauncherActivity > "$D/launch.txt" 2>&1 || true
          sleep 8
          adb shell uiautomator dump /sdcard/arena-probe.xml >/dev/null 2>&1 || true
          adb exec-out cat /sdcard/arena-probe.xml > "$D/app-ui.xml" || true
          adb shell am force-stop dev.pages.ai_syed_jalal_live.mobile || true
          adb shell am start -W -a android.intent.action.VIEW -c android.intent.category.BROWSABLE -d https://ai-syed-jalal-live.pages.dev/ -p com.android.chrome > "$D/chrome-launch.txt" 2>&1 || true
          sleep 10
          adb shell uiautomator dump /sdcard/arena-probe.xml >/dev/null 2>&1 || true
          adb exec-out cat /sdcard/arena-probe.xml > "$D/chrome-ui.xml" || true
          python3 - "$D" <<'PY'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])
          for p in sorted(root.iterdir()):
              text=p.read_text(encoding='utf8',errors='replace')
              if p.name=='chrome.txt':
                  text='\n'.join(line.strip() for line in text.splitlines() if any(x in line.lower() for x in ('versionname=', 'versioncode=', 'enabled=', 'customtabs', 'app_browser')))
              if p.suffix=='.xml':
                  text=' | '.join(re.findall(r'(?:text|content-desc|package)="([^"]+)"',text))
              text=(text[:6500] or 'No output').replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print(f'::notice file=android/README.md,line=1,title=API26 probe {p.name}::{text}')
          PY
          SCRIPT
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect the browser on Android 8
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis_playstore
          arch: x86
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash "$RUNNER_TEMP/browser-probe.sh"
