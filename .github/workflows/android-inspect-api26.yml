name: Inspect Android 8 launch test

on:
  push:
    branches: ['arena/**']
    paths: ['.github/workflows/android-inspect-api26.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect synthetic emulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43257701553 -R "$GITHUB_REPOSITORY" -n android-launch-evidence-api-26 -D "$RUNNER_TEMP/evidence"
          python3 - "$RUNNER_TEMP/evidence" <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1])
          for p in sorted(root.iterdir()):
              if p.is_file() and p.suffix == '.txt' and p.name != 'packages.txt':
                  text=p.read_text(encoding='utf8',errors='replace')[:5000]
                  text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print(f'::notice file=android/README.md,line=1,title=API26 {p.name}::{text}')
          PY
