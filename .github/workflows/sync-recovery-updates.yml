name: Sync verified recovery updates

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Existing extracted-source branch"
        required: true
        default: "recovery/extracted-source-2026-10-11"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout extracted source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 1

      - name: Apply verified Wikipedia adapter and contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="source/AI-Syed-Jalal-FINAL-RECOVERED"
          test -f "$ROOT/backend/server.mjs"
          test -f "$ROOT/backend/ai-runtime.mjs"
          python3 - <<'PY'
          from pathlib import Path
          import json
          root = Path("source/AI-Syed-Jalal-FINAL-RECOVERED")
          (root / "backend/knowledge").mkdir(parents=True, exist_ok=True)
          (root / "backend/knowledge/wikipedia.mjs").write_text("""const API_URL = 'https://en.wikipedia.org/w/api.php';
          const MAX_QUERY_LENGTH = 200;
          function stripHtml(value = '') {
            return String(value).replace(/<[^>]*>/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#039;|&#39;/g, "'").replace(/\\s+/g, ' ').trim();
          }
          export async function searchWikipedia(query, options = {}) {
            const q = String(query ?? '').trim();
            if (q.length < 2) throw new TypeError('Wikipedia query must contain at least 2 characters.');
            if (q.length > MAX_QUERY_LENGTH) throw new RangeError(`Wikipedia query must be ${MAX_QUERY_LENGTH} characters or fewer.`);
            const fetchImpl = options.fetchImpl || globalThis.fetch;
            if (typeof fetchImpl !== 'function') throw new Error('Fetch is unavailable in this runtime.');
            const url = new URL(API_URL);
            url.search = new URLSearchParams({ action: 'query', list: 'search', srsearch: q, srlimit: String(Math.min(5, Math.max(1, Number(options.limit) || 5))), format: 'json', formatversion: '2', origin: '*' }).toString();
            const response = await fetchImpl(url, { headers: { Accept: 'application/json', 'User-Agent': 'AI-Syed-Jalal/1.0 (Wikipedia knowledge adapter)' }, signal: AbortSignal.timeout(Math.min(10000, Math.max(1000, Number(options.timeoutMs) || 8000))) });
            if (!response?.ok) throw new Error(`Wikipedia API returned HTTP ${response?.status ?? 'unknown'}.`);
            const payload = await response.json();
            const hits = Array.isArray(payload?.query?.search) ? payload.query.search : [];
            return { source: 'Wikipedia', attribution: 'Text is from Wikipedia contributors and is available under CC BY-SA; consult the linked page for attribution and license details.', retrievedAt: new Date().toISOString(), query: q, results: hits.map(hit => ({ title: String(hit.title || ''), snippet: stripHtml(hit.snippet || ''), pageId: Number(hit.pageid) || null, url: `https://en.wikipedia.org/wiki/${encodeURIComponent(String(hit.title || '').replace(/ /g, '_'))}` })).filter(hit => hit.title && hit.url) };
          }
          """, encoding="utf-8")
          server_path = root / "backend/server.mjs"
          server = server_path.read_text()
          if "from './knowledge/wikipedia.mjs'" not in server:
            marker = "import { runSupervisor, runAutoGPT } from './agent-systems/index.mjs';"
            assert marker in server, "Cannot safely locate server import anchor"
            server = server.replace(marker, marker + "\\nimport { searchWikipedia } from './knowledge/wikipedia.mjs';", 1)
          if "/api/knowledge/wikipedia" not in server:
            marker = "  if(u.pathname==='/api/ai/capabilities'&&req.method==='GET')"
            assert marker in server, "Cannot safely locate API route anchor"
            route = """  if(u.pathname==='/api/knowledge/wikipedia'&&req.method==='GET'){
              const query=String(u.searchParams.get('q')||'').trim();
              if(query.length<2)return send(res,400,{error:'Query must contain at least 2 characters.'},req);
              if(query.length>200)return send(res,413,{error:'Query must be 200 characters or fewer.'},req);
              try{return send(res,200,await searchWikipedia(query),req)}
              catch(e){return send(res,502,{error:'Wikipedia search is temporarily unavailable. Please retry later.',source:'Wikipedia',retrievedAt:new Date().toISOString()},req)}
            }
          """
            server = server.replace(marker, route + marker, 1)
          server_path.write_text(server, encoding="utf-8")
          runtime_path = root / "backend/ai-runtime.mjs"
          runtime = runtime_path.read_text()
          if "from './knowledge/wikipedia.mjs'" not in runtime:
            marker = "import { criticOutput, deterministicRepair } from './ai-quality.mjs';"
            assert marker in runtime, "Cannot safely locate AI runtime import anchor"
            runtime = runtime.replace(marker, marker + "\\nimport { searchWikipedia } from './knowledge/wikipedia.mjs';", 1)
          if "name: 'search_wikipedia'" not in runtime:
            marker = "const tools = ["
            tool = "  { type: 'function', function: { name: 'search_wikipedia', description: 'Search English Wikipedia for background knowledge. Return page links and retrieval time; do not treat Wikipedia as a primary source for current or medical claims.', parameters: { type: 'object', properties: { query: { type: 'string', minLength: 2, maxLength: 200 }, limit: { type: 'integer', minimum: 1, maximum: 5 } }, required: ['query'], additionalProperties: false } } },\\n"
            assert marker in runtime, "Cannot safely locate tool registry anchor"
            runtime = runtime.replace(marker, marker + "\\n" + tool, 1)
          if "name === 'search_wikipedia'" not in runtime:
            marker = "function inventory() {"
            assert marker in runtime, "Cannot safely locate tool execution anchor"
            runtime = runtime.replace(marker, "async function executeTool(name, args) {\\n  if (name === 'search_wikipedia') return await searchWikipedia(args?.query, { limit: args?.limit });\\n}\\n\\n" + marker, 1)
          runtime_path.write_text(runtime, encoding="utf-8")
          registry_path = root / "config/v120-feature-registry.json"
          registry = json.loads(registry_path.read_text())
          registry.setdefault("features", {})["wikipediaKnowledgeAgent"] = "dedicated-search-adapter-and-ai-tool-added-live-unverified"
          registry.setdefault("truthBoundary", []).append("Wikipedia adapter has deterministic mocked tests; live Wikimedia availability and source-use behavior require deployment E2E.")
          registry_path.write_text(json.dumps(registry, indent=2) + "\\n", encoding="utf-8")
          pkg_path = root / "backend/package.json"
          pkg = json.loads(pkg_path.read_text())
          scripts = pkg.setdefault("scripts", {})
          scripts["wikipedia-adapter"] = "node ../tests/wikipedia-adapter.mjs"
          scripts["capability-contracts"] = "node ../tests/agent-capability-contracts.mjs"
          release = scripts.get("test:release", "")
          for command in ["npm run wikipedia-adapter", "npm run capability-contracts"]:
            if command not in release:
              release = release + " && " + command
          scripts["test:release"] = release
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\\n", encoding="utf-8")
          (root / "tests/wikipedia-adapter.mjs").write_text("""import assert from 'node:assert/strict';
          import { searchWikipedia } from '../backend/knowledge/wikipedia.mjs';
          let requested;
          const fakeFetch = async (url, options) => ({ ok: true, status: 200, async json() { requested = { url: new URL(url), options }; return { query: { search: [{ pageid: 42, title: 'Artificial intelligence', snippet: 'A <span class="searchmatch">field</span> of study &amp; research.' }, { pageid: 7, title: 'Machine learning', snippet: 'A branch of AI.' }] } }; } });
          const result = await searchWikipedia(' artificial intelligence ', { fetchImpl: fakeFetch, limit: 2 });
          assert.equal(result.source, 'Wikipedia'); assert.equal(result.query, 'artificial intelligence'); assert.equal(result.results.length, 2); assert.equal(result.results[0].pageId, 42); assert.equal(result.results[0].snippet, 'A field of study & research.'); assert.equal(result.results[0].url, 'https://en.wikipedia.org/wiki/Artificial_intelligence'); assert.match(result.attribution, /Wikipedia contributors/); assert.ok(Number.isFinite(Date.parse(result.retrievedAt))); assert.equal(requested.url.searchParams.get('srsearch'), 'artificial intelligence'); assert.equal(requested.url.searchParams.get('srlimit'), '2'); assert.match(requested.options.headers['User-Agent'], /AI-Syed-Jalal/);
          await assert.rejects(() => searchWikipedia('x', { fetchImpl: fakeFetch }), /at least 2/); await assert.rejects(() => searchWikipedia('x'.repeat(201), { fetchImpl: fakeFetch }), /200 characters/); await assert.rejects(() => searchWikipedia('network test', { fetchImpl: async () => ({ ok: false, status: 503 }) }), /HTTP 503/);
          console.log('WIKIPEDIA ADAPTER PASS: validation, bounded query, attribution, safe links, retrieval timestamp, error handling');
          """, encoding="utf-8")
          (root / "integrations/wikipedia").mkdir(parents=True, exist_ok=True)
          (root / "integrations/wikipedia/README.md").write_text("""# Wikipedia Knowledge Adapter

A source-aware English Wikipedia search adapter is included at `backend/knowledge/wikipedia.mjs`.

- Authenticated API: `GET /api/knowledge/wikipedia?q=...`
- AI tool: `search_wikipedia` is available to the shared provider runtime.
- Results include page title, canonical page URL, retrieval timestamp, and attribution.
- Query input is bounded to 2–200 characters and results are capped at five.
- Requests have an eight-second default timeout and failures are reported as unavailable rather than replaced with fabricated citations.

Wikipedia is a discovery/background source, not a primary source for current events, clinical guidance, or consequential decisions. Live Wikimedia connectivity must be verified in the deployed environment.

Offline test: `node tests/wikipedia-adapter.mjs`.
""", encoding="utf-8")
          (root / "docs/RECOVERY-UPDATE-2026-10-11.md").write_text("""# Recovery Master Update — 2026-10-11

The extracted source tree is published on the recovery branch. This additive sync adds the bounded Wikipedia knowledge adapter, authenticated API route, AI tool contract, deterministic adapter test, package scripts, and feature-registry truth state.

Offline regression tests are evidence of source behavior only. Live Wikimedia, provider, PostgreSQL, browser/mobile, voice/camera, and production deployment checks remain pending. The locked Login/Homepage/Logo design baseline is preserved.
""", encoding="utf-8")
          print("Recovery update files and integration points written.")
          PY

      - name: Verify syntax and adapter contracts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="source/AI-Syed-Jalal-FINAL-RECOVERED"
          node --check "$ROOT/backend/knowledge/wikipedia.mjs"
          node --check "$ROOT/backend/server.mjs"
          node --check "$ROOT/backend/ai-runtime.mjs"
          node "$ROOT/tests/wikipedia-adapter.mjs"
          git status --short

      - name: Commit and push sync
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/AI-Syed-Jalal-FINAL-RECOVERED
          git commit -m "Sync verified Wikipedia knowledge adapter updates"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$TARGET_BRANCH"
