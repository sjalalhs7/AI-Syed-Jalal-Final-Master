name: Inspect isolated save test evidence

on:
  push:
    branches: ['arena/fc4ccb59-ai-syed-jalal-final-master']
    paths: ['.github/workflows/save-test-diagnostics.yml']

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download disposable browser-test evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: browser-test-evidence
          path: evidence
          github-token: ${{ github.token }}
          run-id: 43464045883
      - name: Annotate sanitized request interception facts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          from zipfile import ZipFile
          import json

          matches = 0
          for path in Path('evidence').rglob('*.zip'):
              with ZipFile(path) as archive:
                  traces = [name for name in archive.namelist() if name.endswith('.trace')]
                  events = []
                  for name in traces:
                      for line in archive.read(name).decode('utf-8').splitlines():
                          try:
                              events.append(json.loads(line))
                          except json.JSONDecodeError:
                              pass
                  options = [e for e in events if e.get('type') == 'context-options']
                  if not any('console keeps a malformed save unconfirmed' in str(e.get('title', '')) for e in options):
                      continue
                  matches += 1
                  requests = []
                  for name in archive.namelist():
                      if not name.endswith('.network'):
                          continue
                      for line in archive.read(name).decode('utf-8').splitlines():
                          try:
                              snap = json.loads(line).get('snapshot', {})
                          except json.JSONDecodeError:
                              continue
                          request = snap.get('request', {})
                          if urlsplit(request.get('url', '')).path != '/api/assistant/confirm':
                              continue
                          response = snap.get('response', {})
                          content = response.get('content', {})
                          result = {'method': request.get('method'), 'status': response.get('status'),
                                    'wasFulfilled': snap.get('_wasFulfilled'), 'resourceType': snap.get('_resourceType'),
                                    'fromServiceWorker': snap.get('_fromServiceWorker')}
                          try:
                              body = json.loads(archive.read(content.get('_file', '')).decode('utf-8'))
                              result.update({'responseOk': body.get('ok'), 'hasTask': isinstance(body.get('task'), dict),
                                             'hasOutput': isinstance(body.get('output'), str)})
                          except (KeyError, ValueError, TypeError):
                              result['bodyReadable'] = False
                          requests.append(result)
                  actions = []
                  for event in events:
                      if event.get('type') != 'before':
                          continue
                      method, cls, params = event.get('method'), event.get('class'), event.get('params') or {}
                      if method == 'setNetworkInterceptionPatterns':
                          actions.append({'class': cls, 'method': method, 'time': event.get('startTime'),
                                          'patterns': [p.get('glob') for p in params.get('patterns', [])]})
                      elif cls == 'Route':
                          actions.append({'class': cls, 'method': method, 'time': event.get('startTime')})
                      elif method == 'click' and 'Confirm & save' in str(params.get('selector', '')):
                          actions.append({'class': cls, 'method': method, 'time': event.get('startTime')})
                  report = {'matches': matches, 'serviceWorkers': [e.get('options', {}).get('serviceWorkers') for e in options],
                            'confirmRequests': requests, 'relevantActions': actions}
                  print('::notice title=Disposable save trace::' + json.dumps(report, separators=(',', ':')))
                  break
          if not matches:
              print('::warning title=Disposable save trace::No matching trace was found in the downloaded artifact.')
          PY
