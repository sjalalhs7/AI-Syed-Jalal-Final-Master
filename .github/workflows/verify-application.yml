name: Verify application
on:
  push:
    branches: [main, "arena/**"]
    paths: ['source/AI-Syed-Jalal-FINAL-RECOVERED/**', '.github/workflows/verify-application.yml']
  pull_request:
    paths: ['source/AI-Syed-Jalal-FINAL-RECOVERED/**', '.github/workflows/verify-application.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-earlier-browser-failure:
    # Temporary diagnostic: summarize the prior disposable-test artifact without exposing page snapshots.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/474513c1-ai-syed-jalal-final-master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Inspect earlier browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 42451131982 --name browser-test-evidence --dir "$RUNNER_TEMP/browser-evidence"
          python3 - <<'PY'
          import os
          from pathlib import Path
          files = sorted((Path(os.environ['RUNNER_TEMP']) / 'browser-evidence').rglob('error-context.md'))
          if not files:
              print('::notice title=Earlier browser evidence::No error-context files were found.')
          for path in files:
              raw = path.read_text(encoding='utf-8', errors='replace')
              def notice(title, text):
                  text = text[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={title}::{text}')
              notice('Earlier browser failure', raw.split('# Test source', 1)[0])
              snapshot = raw.partition('# Page snapshot')[2]
              lines = snapshot.splitlines()
              matches = [i for i, line in enumerate(lines) if any(word in line.lower() for word in ['repair', 'schema', 'session', 'cancelled', 'aborted', 'timed out'])]
              indices = sorted({j for i in matches for j in range(max(0, i-1), min(len(lines), i+2))})
              notice('Repair status in disposable test snapshot', '\n'.join(lines[i] for i in indices))
              from zipfile import ZipFile
              import json
              for trace in path.parent.glob('*.zip'):
                  with ZipFile(trace) as archive:
                      for name in archive.namelist():
                          if not name.endswith('.network'): continue
                          items = []
                          for line in archive.read(name).splitlines():
                              entry = json.loads(line).get('snapshot', {})
                              url = entry.get('request', {}).get('url', '')
                              if '/api/me' in url or '/api/admin/schema/repair' in url:
                                  items.append({'path':url.split('/api/', 1)[-1], 'status':entry.get('response', {}).get('status'), 'time':entry.get('time')})
                          if items: notice('Disposable test session and repair requests', json.dumps(items[-20:]))
          PY
  application:
    runs-on: ubuntu-latest
    # Cold Chromium/PGlite runs can exceed 15 minutes on slower hosted runners.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source/AI-Syed-Jalal-FINAL-RECOVERED
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/AI-Syed-Jalal-FINAL-RECOVERED/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Frontend contract tests
        run: npm --prefix frontend test
      - name: Server and integration tests
        run: node --test --test-concurrency=1 server/tests/*.test.mjs
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm --prefix backend run test:release
      - run: node --check worker/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            source/AI-Syed-Jalal-FINAL-RECOVERED/test-results/
            source/AI-Syed-Jalal-FINAL-RECOVERED/playwright-report/
          retention-days: 7
