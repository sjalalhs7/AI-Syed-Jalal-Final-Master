name: Verify application
on:
  push:
    branches: [main, "arena/**"]
    paths: ['source/AI-Syed-Jalal-FINAL-RECOVERED/**', '.github/workflows/verify-application.yml']
  pull_request:
    paths: ['source/AI-Syed-Jalal-FINAL-RECOVERED/**', '.github/workflows/verify-application.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-earlier-browser-failure:
    # Temporary diagnostic: summarize the prior disposable-test artifact without exposing page snapshots.
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/474513c1-ai-syed-jalal-final-master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Inspect earlier browser evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 42451131982 --name browser-test-evidence --dir "$RUNNER_TEMP/browser-evidence"
          python3 - <<'PY'
          import os
          from pathlib import Path
          files = sorted((Path(os.environ['RUNNER_TEMP']) / 'browser-evidence').rglob('error-context.md'))
          if not files:
              print('::notice title=Earlier browser evidence::No error-context files were found.')
          import shutil, subprocess
          for path in files:
              raw = path.read_text(encoding='utf-8', errors='replace')
              def notice(title, text):
                  text = text[:6000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title={title}::{text}')
              notice('Earlier browser failure', raw.split('# Test source', 1)[0])
              screenshots = sorted(path.parent.glob('*.png'))
              notice('Screenshot diagnostic', json.dumps({'files': [p.name for p in screenshots], 'ocrAvailable':bool(shutil.which('tesseract'))}))
              if screenshots and shutil.which('tesseract'):
                  ocr = subprocess.run(['tesseract', str(screenshots[-1]), 'stdout'], capture_output=True, text=True).stdout
                  relevant = [line for line in ocr.splitlines() if any(word in line.lower() for word in ['repair', 'session', 'partial', 'aborted', 'cancelled', 'schema'])]
                  notice('Disposable test screenshot status', '\n'.join(relevant))
              snapshot = raw.partition('# Page snapshot')[2]
              lines = snapshot.splitlines()
              matches = [i for i, line in enumerate(lines) if any(word in line.lower() for word in ['repair', 'schema', 'session', 'cancelled', 'aborted', 'timed out'])]
              indices = sorted({j for i in matches for j in range(max(0, i-1), min(len(lines), i+2))})
              notice('Repair status in disposable test snapshot', '\n'.join(lines[i] for i in indices))
              from zipfile import ZipFile
              import json
              for trace in path.parent.glob('*.zip'):
                  with ZipFile(trace) as archive:
                      for name in archive.namelist():
                          if not name.endswith('.network'): continue
                          items = []
                          for line in archive.read(name).splitlines():
                              entry = json.loads(line).get('snapshot', {})
                              url = entry.get('request', {}).get('url', '')
                              if '/api/me' in url or '/api/admin/schema/repair' in url:
                                  items.append({'path':url.split('/api/', 1)[-1], 'status':entry.get('response', {}).get('status'), 'duration':entry.get('time'), 'at':entry.get('_monotonicTime')})
                          if items: notice('Disposable test session and repair requests', json.dumps(items[-20:]))
                          for line in archive.read(name).splitlines():
                              entry = json.loads(line).get('snapshot', {})
                              if '/api/me' not in entry.get('request', {}).get('url', ''): continue
                              response = entry.get('response', {})
                              content = response.get('content', {})
                              resource = content.get('_file')
                              meta = {'at':entry.get('_monotonicTime'), 'status':response.get('status'), 'statusText':response.get('statusText'), 'content':content, 'timings':entry.get('timings'), 'failure':entry.get('_failureText'), 'headers':[h for h in response.get('headers', []) if h.get('name', '').lower() in ['content-type', 'content-length', 'transfer-encoding']]}
                              if resource:
                                  try:
                                      data = json.loads(archive.read(resource))
                                      meta.update({'authenticated':data.get('authenticated'), 'role':(data.get('user') or {}).get('role'), 'csrfPresent':bool(data.get('csrfToken')), 'error':data.get('error')})
                                  except Exception: meta['bodyParseFailed'] = True
                              notice('Disposable session response shape', json.dumps(meta))
                      for name in archive.namelist():
                          if not name.endswith('.trace'): continue
                          events = [json.loads(line) for line in archive.read(name).splitlines()]
                          tracking = False
                          actions = []
                          for event in events:
                              if event.get('type') == 'before' and event.get('method') == 'click' and '#schemaRepairBtn' in str(event.get('params', {}).get('selector', '')):
                                  tracking = True
                              if not tracking: continue
                              if event.get('type') == 'before':
                                  actions.append({k:event.get(k) for k in ['type','callId','class','method','title','params','startTime'] if k in event})
                              elif event.get('type') in ['log', 'after', 'event']:
                                  actions.append({k:event.get(k) for k in ['type','callId','method','message','error','time','endTime'] if k in event})
                          if actions: notice('Repair click trace', json.dumps(actions[-45:]))
                          def target_nodes(node):
                              if not isinstance(node, list): return []
                              found = [node] if len(node) > 1 and isinstance(node[1], dict) and node[1].get('id') in ['schemaRepairResult', 'schemaRepairTag', 'schemaRepairBtn'] else []
                              for child in node: found.extend(target_nodes(child))
                              return found
                          snapshots = []
                          for event in events:
                              if event.get('type') != 'frame-snapshot': continue
                              snap = event.get('snapshot', {})
                              nodes = target_nodes(snap.get('html'))
                              if nodes and snap.get('timestamp', 0) > 382900:
                                  snapshots.append({'at':snap.get('timestamp'), 'phase':snap.get('phase'), 'nodes':nodes})
                          if snapshots: notice('Disposable repair result snapshots', json.dumps(snapshots[-8:]))
          PY
  application:
    runs-on: ubuntu-latest
    # Cold Chromium/PGlite runs can exceed 15 minutes on slower hosted runners.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source/AI-Syed-Jalal-FINAL-RECOVERED
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/AI-Syed-Jalal-FINAL-RECOVERED/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Frontend contract tests
        run: npm --prefix frontend test
      - name: Server and integration tests
        run: node --test --test-concurrency=1 server/tests/*.test.mjs
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm --prefix backend run test:release
      - run: node --check worker/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            source/AI-Syed-Jalal-FINAL-RECOVERED/test-results/
            source/AI-Syed-Jalal-FINAL-RECOVERED/playwright-report/
          retention-days: 7
