name: Verify application
on:
  push:
    branches: [arena/342bece0-ai-syed-jalal-final-master]
    paths: ['source/AI-Syed-Jalal-FINAL-RECOVERED/**', '.github/workflows/verify-application.yml']
  pull_request:
    paths: ['source/AI-Syed-Jalal-FINAL-RECOVERED/**', '.github/workflows/verify-application.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source/AI-Syed-Jalal-FINAL-RECOVERED
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/AI-Syed-Jalal-FINAL-RECOVERED/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm --prefix backend run test:release
      - run: node --check worker/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-evidence
          path: |
            source/AI-Syed-Jalal-FINAL-RECOVERED/test-results/
            source/AI-Syed-Jalal-FINAL-RECOVERED/playwright-report/
          retention-days: 7
