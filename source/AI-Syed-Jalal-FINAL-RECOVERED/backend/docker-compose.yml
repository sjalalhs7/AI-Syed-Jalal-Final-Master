services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alsyed_jalal
      POSTGRES_USER: alsyed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alsyed -d alsyed_jalal"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://alsyed:${POSTGRES_PASSWORD}@db:5432/alsyed_jalal
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      CSRF_SECRET: ${CSRF_SECRET:?set in .env}
      NODE_ENV: production
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      PGSSL: ${PGSSL:-false}
      PGSSL_REJECT_UNAUTHORIZED: ${PGSSL_REJECT_UNAUTHORIZED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_ENABLE_GOOGLE_SEARCH: ${GEMINI_ENABLE_GOOGLE_SEARCH:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OMNIROUTE_KEY: ${OMNIROUTE_KEY:-}
      OMNIROUTE_MODEL: ${OMNIROUTE_MODEL:-auto}
      OMNIROUTE_URL: ${OMNIROUTE_URL:-http://localhost:20128}
    ports:
      - "8787:8787"
    command: sh -c "node scripts/migrate.mjs && node scripts/seed.mjs && node server.mjs"
volumes:
  postgres_data:
