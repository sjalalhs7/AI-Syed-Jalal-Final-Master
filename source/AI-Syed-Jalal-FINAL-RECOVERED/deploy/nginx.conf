server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Same-origin API: browser talks to /api, nginx forwards to the api container.
  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  # Service worker and pages must never be served stale.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~* \.(html)$ { add_header Cache-Control "no-cache"; }
  # Real files only for assets: a missing asset is a 404, not index.html.
  location ~* \.(css|js|svg|png|jpg|webp|json|webmanifest|xml|txt)$ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
