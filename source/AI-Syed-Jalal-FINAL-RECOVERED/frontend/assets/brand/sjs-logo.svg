<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">SJS — Alsyed Jalal AI</title>
  <desc id="d">The SJS monogram in gold and emerald inside orbital rings: the mark of the Alsyed Jalal AI assistant and agent platform.</desc>
  
  <defs>
    <radialGradient id="tile" cx="50%" cy="22%" r="86%">
      <stop offset="0" stop-color="#182046"/><stop offset="0.52" stop-color="#0b1122"/><stop offset="1" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="gold" x1="96" y1="160" x2="416" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2b8"/><stop offset="0.32" stop-color="#ffd15a"/>
      <stop offset="0.68" stop-color="#ff9500"/><stop offset="1" stop-color="#ffc84a"/>
    </linearGradient>
    <linearGradient id="emerald" x1="238" y1="150" x2="286" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4ffdb"/><stop offset="0.45" stop-color="#38e08c"/><stop offset="1" stop-color="#0c9d63"/>
    </linearGradient>
    <linearGradient id="orbit" x1="48" y1="120" x2="464" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd15a"/><stop offset="0.48" stop-color="#ff8b00"/>
      <stop offset="0.78" stop-color="#38e08c"/><stop offset="1" stop-color="#43d9ff"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  
  <g transform="translate(256,266) scale(0.94) translate(-256,-266)">
    
  <g fill="none">
    <ellipse cx="256" cy="266" rx="196" ry="60" transform="rotate(-17 256 266)" stroke="url(#orbit)" stroke-width="2.4" opacity="0.5"/>
    <ellipse cx="256" cy="266" rx="168" ry="92" transform="rotate(25 256 266)" stroke="url(#orbit)" stroke-width="1.8" opacity="0.28"/>
    <circle cx="256" cy="256" cy2="256" r="208" stroke="#ffffff" stroke-width="1.3" opacity="0.08"/>
    <circle cx="256" cy="266" r="208" stroke="url(#orbit)" stroke-width="4" stroke-dasharray="5 232" stroke-linecap="round" opacity="0.9" transform="rotate(-46 256 266)"/>
  </g>
    
  <g font-family="SJS" font-size="186" font-weight="900" text-anchor="middle" filter="url(#lift)">
    <text x="256" y="340" fill="url(#gold)">S<tspan fill="url(#emerald)">J</tspan>S</text>
  </g>
    
  <path d="M388 130 C392 149 399 156 418 160 C399 164 392 171 388 190 C384 171 377 164 358 160 C377 156 384 149 388 130Z" fill="#fff8d6" opacity="0.92"/>
  <path d="M136 152 C138 163 142 167 153 169 C142 171 138 175 136 186 C134 175 130 171 119 169 C130 167 134 163 136 152Z" fill="#9dffd6" opacity="0.62"/>
