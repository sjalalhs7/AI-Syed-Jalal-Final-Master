<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">SJS</title><desc id="d">Compact SJS mark for small sizes.</desc>
  <defs>
    <radialGradient id="tile" cx="50%" cy="22%" r="86%">
      <stop offset="0" stop-color="#182046"/><stop offset="0.52" stop-color="#0b1122"/><stop offset="1" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="gold" x1="96" y1="160" x2="416" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2b8"/><stop offset="0.32" stop-color="#ffd15a"/>
      <stop offset="0.68" stop-color="#ff9500"/><stop offset="1" stop-color="#ffc84a"/>
