services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: alsyed_jalal
      POSTGRES_USER: alsyed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alsyed -d alsyed_jalal"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
  api:
    build:
      context: ../../current/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgresql://alsyed:${POSTGRES_PASSWORD}@db:5432/alsyed_jalal
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      SESSION_COOKIE_SECURE: "true"
      PGSSL: "false"
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OMNIROUTE_KEY: ${OMNIROUTE_KEY:-}
    expose: ["8787"]
    command: sh -c "node scripts/migrate.mjs && node server.mjs"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]
  seed:
    build:
      context: ../../current/backend
    profiles: ["seed"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alsyed:${POSTGRES_PASSWORD}@db:5432/alsyed_jalal
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    command: ["node", "scripts/seed.mjs"]
    networks: [internal]
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../current/frontend:/srv/frontend:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]
networks:
  internal:
    driver: bridge
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
