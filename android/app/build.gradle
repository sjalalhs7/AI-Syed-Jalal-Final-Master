plugins { id 'com.android.application' }

android {
    // Provisional. The owner must confirm a unique, permanent Play application ID
    // before publishing; changing it later creates a different Play app.
    namespace 'dev.pages.ai_syed_jalal_live.twa'
    compileSdk 36
    defaultConfig {
        // A different package ID allows this signing identity to be installed
        // beside the earlier debug APK without uninstalling it or its data.
        // This identifier is still provisional until the owner confirms it.
        applicationId 'dev.pages.ai_syed_jalal_live.mobile'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.0.2'
    }
    buildTypes {
        // Release builds are intentionally UNSIGNED until the owner signs them.
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.2'
}
